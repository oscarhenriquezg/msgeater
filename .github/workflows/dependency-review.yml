# Bloquea PRs que introduzcan dependencias nuevas con vulnerabilidades
# HIGH/CRITICAL conocidas. Complementa a Dependabot (que vigila lo ya
# instalado): esto vigila lo que un PR intenta agregar.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
