# Bloquea PRs que introduzcan dependencias nuevas con vulnerabilidades
# HIGH/CRITICAL conocidas. Complementa a Dependabot (que vigila lo ya
# instalado): esto vigila lo que un PR intenta agregar.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
