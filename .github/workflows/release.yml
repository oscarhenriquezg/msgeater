# Release: al subir un tag v* se construyen y publican los instalables.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el release (draft) y subir sus assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Verificar tamaño (NFR-06 ≤150 MB)
        run: |
          for f in release/*.AppImage; do
            size=$(stat -c%s "$f")
            [ "$size" -le $((150 * 1024 * 1024)) ] || { echo "$f excede 150MB"; exit 1; }
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # crear el release (draft) y subir sus assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      # Sin firma: el dmg/zip se publica sin notarizar (Gatekeeper avisará).
      # Para firmar: definir CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID en secrets.
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            release/*.dmg
            release/*.zip

  # Metadatos de seguridad sobre los artefactos ya publicados (draft): un
  # checksum y una procedencia firmada que un tercero puede verificar sin
  # tener que confiar ciegamente en el autor. No reconstruye nada; opera
  # sobre los binarios que build-linux/build-macos ya subieron.
  finalize:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # descargar/subir assets del release (draft)
      id-token: write # firmar la attestation (Sigstore/OIDC)
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Descargar los artefactos ya publicados
        run: gh release download "$TAG" --repo "$REPO" --dir dl

      - name: Generar SHA256SUMS
        run: |
          (cd dl && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Generar SBOM (SPDX, dependency graph nativo de GitHub)
        run: |
          version="${TAG#v}"
          gh api "repos/${REPO}/dependency-graph/sbom" --jq '.sbom' \
            > "msgeater-${version}.spdx.json"

      # Prueba criptográfica (Sigstore) de que estos archivos concretos
      # salieron de este workflow, en este repo, en este commit. Verificable
      # con: gh attestation verify <archivo> --repo oscarhenriquezg/msgeater
      - name: Firmar procedencia (GitHub Artifact Attestations)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dl/*

      # El bundle ya generado arriba (mismo contenido, mismo commit) se
      # adjunta también como asset del release: la verificación real vive en
      # la API de attestations de GitHub (paso anterior), esto es solo para
      # que quien audite el release sin usar `gh attestation verify` tenga
      # el archivo a mano. Se publican los dos formatos del MISMO material:
      #  - .sigstore.json : el bundle Sigstore completo (firma + cadena de
      #    confianza + el envelope). Es lo que consumen cosign y las
      #    herramientas del ecosistema Sigstore.
      #  - .intoto.jsonl  : solo el DSSE envelope, una línea JSON, que es el
      #    formato in-toto estándar de attestations (el mismo que emite el
      #    generador SLSA). No es un archivo distinto ni una firma extra:
      #    se extrae del bundle anterior con jq.
      - name: Copiar el bundle de procedencia con nombre de release
        run: |
          version="${TAG#v}"
          bundle="${{ steps.attest.outputs.bundle-path }}"
          cp "$bundle" "msgeater-${version}.sigstore.json"
          # -c: una attestation por línea, que es lo que significa la "l" de jsonl.
          jq -c '.dsseEnvelope' "$bundle" > "msgeater-${version}.intoto.jsonl"

      - name: Adjuntar SHA256SUMS, SBOM y bundle de procedencia al release
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" --repo "$REPO" \
            SHA256SUMS \
            "msgeater-${version}.spdx.json" \
            "msgeater-${version}.sigstore.json" \
            "msgeater-${version}.intoto.jsonl"
