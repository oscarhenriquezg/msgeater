# Release: al subir un tag v* se construyen y publican los instalables.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el release (draft) y subir sus assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Verificar tamaño (NFR-06 ≤150 MB)
        run: |
          for f in release/*.AppImage; do
            size=$(stat -c%s "$f")
            [ "$size" -le $((150 * 1024 * 1024)) ] || { echo "$f excede 150MB"; exit 1; }
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # crear el release (draft) y subir sus assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      # Sin firma: el dmg/zip se publica sin notarizar (Gatekeeper avisará).
      # Para firmar: definir CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID en secrets.
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/*.zip

  # Metadatos de seguridad sobre los artefactos ya publicados (draft): un
  # checksum y una procedencia firmada que un tercero puede verificar sin
  # tener que confiar ciegamente en el autor. No reconstruye nada; opera
  # sobre los binarios que build-linux/build-macos ya subieron.
  finalize:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # descargar/subir assets del release (draft)
      id-token: write # firmar la attestation (Sigstore/OIDC)
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Descargar los artefactos ya publicados
        run: gh release download "$TAG" --repo "$REPO" --dir dl

      - name: Generar SHA256SUMS
        run: |
          (cd dl && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Generar SBOM (SPDX, dependency graph nativo de GitHub)
        run: |
          version="${TAG#v}"
          gh api "repos/${REPO}/dependency-graph/sbom" --jq '.sbom' \
            > "msgeater-${version}.spdx.json"

      # Prueba criptográfica (Sigstore) de que estos archivos concretos
      # salieron de este workflow, en este repo, en este commit. Verificable
      # con: gh attestation verify <archivo> --repo oscarhenriquezg/msgeater
      - name: Firmar procedencia (GitHub Artifact Attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dl/*

      - name: Adjuntar SHA256SUMS y SBOM al release
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" --repo "$REPO" \
            SHA256SUMS "msgeater-${version}.spdx.json"
