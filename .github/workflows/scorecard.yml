# OpenSSF Scorecard: evaluación independiente de prácticas de seguridad del
# repo (no un análisis del código en sí). Resultados en Security > Code
# scanning y publicados en https://scorecard.dev (badge en el README).
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Cadencia recomendada por el proyecto Scorecard: prácticas del repo
    # cambian poco de un día a otro.
    - cron: '23 4 * * 2'

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # subir resultados SARIF a code scanning
      id-token: write # firmar los resultados publicados (Sigstore/OIDC)
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # El GITHUB_TOKEN por defecto no puede leer las reglas de branch
          # protection "classic", así que el check Branch-Protection daba
          # error. Este PAT de solo lectura (Administration: read) le da
          # visibilidad. Caduca cada año; regenerarlo en el secret.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
